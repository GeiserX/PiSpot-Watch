<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C51A4A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="white" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Smartwatch / wrist device icon -->
  <g transform="translate(110, 40)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Watch strap top -->
    <path d="M22 0 L22 25 M48 0 L48 25"/>
    <rect x="18" y="0" width="34" height="8" rx="3" opacity="0.5"/>
    <!-- Watch body -->
    <rect x="10" y="25" width="50" height="65" rx="8"/>
    <!-- Screen -->
    <rect x="16" y="32" width="38" height="50" rx="4" opacity="0.6"/>
    <!-- WiFi symbol on screen -->
    <path d="M25 62 C35 48, 35 48, 45 62" opacity="0.8"/>
    <path d="M29 58 C35 50, 35 50, 41 58" opacity="0.8"/>
    <circle cx="35" cy="62" r="2" fill="white" stroke="none" opacity="0.8"/>
    <!-- Side button -->
    <rect x="60" y="48" width="6" height="12" rx="2" opacity="0.6"/>
    <!-- Watch strap bottom -->
    <path d="M22 90 L22 115 M48 90 L48 115"/>
    <rect x="18" y="107" width="34" height="8" rx="3" opacity="0.5"/>
  </g>
  <!-- Title -->
  <text x="450" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">PiSpot Watch</text>
  <!-- Subtitle -->
  <text x="450" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.85" text-anchor="middle">Wrist-wearable IoT WiFi voucher device</text>
</svg>
